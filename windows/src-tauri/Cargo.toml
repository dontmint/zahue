[package]
name = "zahue-windows"
version = "0.1.0"
description = "ZaHue for Windows — Zalo PC theme switcher"
authors = ["you"]
edition = "2021"
license = "MPL-2.0"

[lib]
name = "zahue_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
